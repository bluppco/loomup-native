name: Native SDK CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift packages
        run: swift test -Xswiftc -warnings-as-errors
      - name: Compile iOS App Attest integration
        run: |
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          swift build \
            --configuration release \
            --triple arm64-apple-ios16.0 \
            --sdk "$IOS_SDK" \
            --scratch-path "$RUNNER_TEMP/loomup-native-ios-build" \
            -Xswiftc -warnings-as-errors
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-36'
      - name: Test Kotlin packages
        working-directory: kotlin
        run: ./gradlew test
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
      - name: Install Dart dependencies
        working-directory: flutter
        run: dart pub get
      - name: Analyze Dart package
        working-directory: flutter
        run: dart analyze
      - name: Test Dart package
        working-directory: flutter
        run: dart test
